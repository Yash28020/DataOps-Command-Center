version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dataops_postgres
    restart: always
    environment:
      POSTGRES_USER: dataops_user
      POSTGRES_PASSWORD: dataops_secure_password_2026
      POSTGRES_DB: dataops_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataops_user -d dataops_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dataops_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://dataops_user:dataops_secure_password_2026@db:5432/dataops_db
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dataops_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
